# llm-platform — pre-commit (مرآة فحوص CI، ADR-008). تفعيل: pre-commit install
# ⚠️ ثبّت كل `rev` على وسم مستقر **قبل أوّل استخدام** (حتمية — ADR-008). القيم أدناه placeholder.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: PIN-AT-INSTALL
    hooks:
      - id: ruff-format          # التنسيق (حَتمي)
      - id: ruff                 # الـ lint — بوّابة (يفشل عند E,F,C90,PLR...)
        args: ["--fix"]

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: PIN-AT-INSTALL
    hooks:
      - id: mypy
        args: ["--config-file", "pyproject.toml"]

  - repo: https://github.com/gitleaks/gitleaks
    rev: PIN-AT-INSTALL
    hooks:
      - id: gitleaks             # كشف الأسرار — بوّابة صلبة (R-ARCH-20)

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: PIN-AT-INSTALL
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files

# pytest يُشغَّل في CI (وقت أطول)، لا كـ pre-commit hook لكل commit (سرعة الـ inner loop).
