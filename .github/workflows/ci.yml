# llm-platform CI — مرآة فحوص pre-commit (ADR-008). يفرض الجودة على كل push/PR.
# المستودع = المنصّة (الجذر، ADR-018)؛ legacy/ مستثنى عبر ruff extend-exclude (ADR-008).
name: ci

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned tools (asyncpg/litellm مُكفّآن في conftest)
        run: pip install ruff==0.12.0 mypy==2.1.0 pytest fastapi httpx
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .
      - name: Mypy (our code)
        run: MYPYPATH=services/memory mypy --config-file pyproject.toml services/memory/app.py services/memory/models.py services/memory/schema.py services/memory/normalize.py services/memory/arabic.py services/memory/embeddings.py config/litellm/memory_hook.py
      - name: Pytest
        run: pytest -q

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # مسح gitleaks مباشر لكامل التاريخ بدل gitleaks-action
      # (الـ action يحسب نطاق <root>^..HEAD ويفشل على commit الجذر في أوّل دفعة لمستودع جديد).
      - name: Install gitleaks (pinned v8.30.1)
        run: curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | sudo tar -xz -C /usr/local/bin gitleaks
      - name: Gitleaks (full-history secret scan — R-ARCH-20)
        run: gitleaks detect --source . --redact -v
