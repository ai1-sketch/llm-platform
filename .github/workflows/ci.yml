# llm-platform CI — مرآة فحوص pre-commit (ADR-008). يفرض الجودة على كل push/PR.
# المستودع = المنصّة (الجذر، ADR-018)؛ legacy/ مستثنى عبر ruff extend-exclude (ADR-008).
# ملاحظة (ADR-025): محرّك السياق المخصّص متقاعد إلى فرع future/context-engine؛ الخطّ الأساسي =
# OWUI (RAG + Memory) + بوّابة LiteLLM + llamacpp + postgres، بلا كود بايثون على المسار الأساسي.
name: ci

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned tools (lint فقط — لا كود بايثون على المسار الأساسي بعد ADR-025)
        run: pip install ruff==0.12.0
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose config (dummy env so required ${VAR:?} resolve)
        run: |
          printf 'POSTGRES_PASSWORD=x\nLITELLM_MASTER_KEY=x\nLITELLM_SALT_KEY=x\nLLAMACPP_API_KEY=x\nOPENWEBUI_LITELLM_KEY=x\nWEBUI_SECRET_KEY=x\n' > /tmp/ci.env
          docker compose -f compose/docker-compose.yml --env-file /tmp/ci.env config -q

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # مسح gitleaks مباشر لكامل التاريخ بدل gitleaks-action
      # (الـ action يحسب نطاق <root>^..HEAD ويفشل على commit الجذر في أوّل دفعة لمستودع جديد).
      - name: Install gitleaks (pinned v8.30.1)
        run: curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | sudo tar -xz -C /usr/local/bin gitleaks
      - name: Gitleaks (full-history secret scan — R-ARCH-20)
        run: gitleaks detect --source . --redact -v
