# llm-platform — pre-commit (فحوص الجودة المحلية: ruff/gitleaks/hooks — ADR-008). تفعيل: pre-commit install
# ملاحظة: فحص compose والثوابت المعمارية (ADR-026) يعملان في CI فقط (يحتاجان docker/pyyaml).
# الإصدارات مثبَّتة (حتمية — ADR-008). مصدر الحقيقة للفرض = CI (.github/workflows/ci.yml).
# ملاحظة (ADR-025): لا كود بايثون على المسار الأساسي → لا hook mypy؛ ruff يبقى لأي ملف مستقبلي.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.0
    hooks:
      - id: ruff-format          # التنسيق (حَتمي)
      - id: ruff                 # الـ lint — بوّابة (يفشل عند E,F,C90,PLR...)
        args: ["--fix"]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks             # كشف الأسرار — بوّابة صلبة (R-ARCH-20)

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
