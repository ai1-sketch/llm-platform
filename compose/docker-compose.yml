# llm-platform — P-01 stack (ADR-005/010/011). 6 خدمات: open-webui → litellm → llamacpp (Gemma 4، GPU) + embeddings (تضمين CPU، ADR-019) + postgres + memory (ذاكرة per-user، ADR-012/013).
# التشغيل (من جذر المستودع):
#   cp config/env/.env.example config/env/.env   # ثم املأ القيم
#   docker compose --env-file config/env/.env -f compose/docker-compose.yml up -d
# شرط مسبق: Docker Desktop (WSL2 backend) + تعريف NVIDIA لويندوز يدعم WSL2 GPU.
#   تحقّق أوّلاً: docker run --rm --gpus all nvidia/cuda:12.4.0-base-ubuntu22.04 nvidia-smi
# قواعد: litellm/llamacpp غير مكشوفة (R-ARCH-24) · أسرار من env (R-ARCH-20) · أسماء حياديّة (R-ARCH-31).
# ✓ الصور مثبّتة بـ digest (إعادة الإنتاج). للترقية: حدّث الـ digest يدوياً بعد سحب الوسم + اختبار.
name: llm-platform

services:
  llamacpp:                                  # المحرّك: llama.cpp server (CUDA) يخدم Gemma 4 على GPU (ADR-011)
    image: ghcr.io/ggml-org/llama.cpp@sha256:0a8757369e1e3338386883b23bf1bd5dde46c9060d852a798207fe5fe51e6965   # server-cuda مُثبَّت بـ digest (2026-06-25، يدعم gemma4)
    restart: unless-stopped
    volumes:
      - "${MODEL_DIR:-../models-gemma4}:/models:ro"   # مجلّد GGUF على المضيف (نسبةً لـ compose/ في جذر المستودع) أو مسار مطلق
    command: >
      -m /models/${MODEL_FILE:-gemma-4-E2B-it-qat-UD-Q4_K_XL.gguf}
      --mmproj /models/${MMPROJ_FILE:-mmproj-F16.gguf}
      --no-mmproj-offload
      --image-max-tokens ${IMAGE_MAX_TOKENS:-256}
      --host 0.0.0.0 --port 8080
      --n-gpu-layers ${N_GPU_LAYERS:-999}
      --ctx-size ${CTX_SIZE:-4096}
      --api-key ${LLAMACPP_API_KEY:?LLAMACPP_API_KEY مفقود}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks: [internal]
    # لا healthcheck: الصورة minimal بلا curl. litellm تعتمد عليها بـ service_started وتعيد المحاولة حتى يُحمَّل الموديل.
    # (عند أوّل تشغيل: docker exec llamacpp sh -c "which curl wget python3" لتقرير healthcheck لاحق على /health.)

  embeddings:                                # محرّك التضمين: Qwen3-Embedding-0.6B على CPU (ADR-019) — لا يزاحم Gemma على الـ GPU
    image: ghcr.io/ggml-org/llama.cpp@sha256:354391e1edaa308ae3145f3137deab808e7f4fcef55f331443f7f68c158f6a12   # llama.cpp:server (CPU) مُثبَّت بـ digest (2026-06-25، ADR-019)
    restart: unless-stopped
    volumes:
      - "${EMBED_MODEL_DIR:-../models-embeddings}:/models:ro"   # مجلّد GGUF للتضمين (نسبةً لـ compose/)
    command: >
      -m /models/${EMBED_MODEL_FILE:-Qwen3-Embedding-0.6B-Q8_0.gguf}
      --embedding --pooling last
      --host 0.0.0.0 --port 8080
      --ctx-size ${EMBED_CTX_SIZE:-2048}
      --api-key ${LLAMACPP_API_KEY:?LLAMACPP_API_KEY مفقود}
    networks: [internal]                       # داخلية فقط (غير مكشوفة)
    # CPU فقط (بلا حجز GPU) — يوفّر VRAM لـ Gemma. لا healthcheck (صورة minimal بلا curl).

  litellm:                                   # البوّابة (R-ARCH-31)
    image: ghcr.io/berriai/litellm@sha256:8f3517476b8293ccc1c3b0da7940d8dabbfe64b013454113f5a3cb68265c439b   # main-stable مُثبَّت بـ digest (2026-06-25)
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      llamacpp:
        condition: service_started            # يبدأ مع إقلاع المحرّك؛ retry يغطّي زمن تحميل الموديل
      memory:
        condition: service_healthy            # الذاكرة جاهزة قبل البوّابة
      embeddings:
        condition: service_started            # البوّابة تخدم embed-default بتمرير لمحرّك التضمين (ADR-023)
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?LITELLM_MASTER_KEY مفقود}   # fail-fast (R-ERR-02)
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY:?LITELLM_SALT_KEY مفقود}
      DATABASE_URL: postgresql://litellm:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD مفقود}@postgres:5432/litellm
      LLAMACPP_API_KEY: ${LLAMACPP_API_KEY:?LLAMACPP_API_KEY مفقود}   # يطابق --api-key للمحرّك
      LITELLM_LOG: ${LITELLM_LOG:-INFO}                              # مستوى السجل (R-ERR-17)
      CTX_MODEL_WINDOW: ${CTX_MODEL_WINDOW:-4096}                    # ميزانية حقن الذاكرة واعية بالنافذة (ADR-021)
      CTX_RESERVED_TOKENS: ${CTX_RESERVED_TOKENS:-2560}             # محجوز للجواب + الرسائل الحيّة
      CTX_INJECTION_BUDGET: ${CTX_INJECTION_BUDGET:-1000}          # سقف الحقن المرغوب (يُقصّ بـ window-reserved)
    volumes:
      - ../config/litellm/litellm-config.yaml:/app/config.yaml:ro
      - ../config/litellm/memory_hook.py:/app/custom_hook.py:ro   # hook الذاكرة per-user (ADR-012)
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    networks: [internal]
    healthcheck:
      # صورة litellm (Chainguard) بلا curl/wget → python (المسار /health/liveliness مؤكَّد)
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:4000/health/liveliness').status==200 else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  open-webui:                                # الواجهة — نقطة الدخول الوحيدة المكشوفة
    image: ghcr.io/open-webui/open-webui@sha256:7f1b0a1a50cfbac23da3b16f96bc968fd757b26dc9e54e93813d61768ea9184e   # main مُثبَّت بـ digest (2026-06-25)
    restart: unless-stopped
    depends_on:
      litellm:
        condition: service_healthy
    environment:
      OPENAI_API_BASE_URL: http://litellm:4000/v1            # تكلّم البوّابة فقط (R-ARCH-10)
      OPENAI_API_KEY: ${OPENWEBUI_LITELLM_KEY:?OPENWEBUI_LITELLM_KEY مفقود}   # virtual key من litellm
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY:?WEBUI_SECRET_KEY مفقود}
      GLOBAL_LOG_LEVEL: ${WEBUI_LOG_LEVEL:-INFO}              # مستوى السجل (R-ERR-17)
      ENABLE_FORWARD_USER_INFO_HEADERS: "true"               # يمرّر X-OpenWebUI-User-* للبوّابة (للذاكرة per-user)
      WEBUI_NAME: ${WEBUI_NAME:-Sankari Chat}                 # اسم التطبيق/الواجهة المعروض (علامة، ليس اسم الموديل — ADR-017)
      ENABLE_EVALUATION_ARENA_MODELS: "false"                # نُطفئ موديل Arena الافتراضي (نريد موديلاً واحداً يظهر — Gemma 4)
    volumes:
      - openwebui-data:/app/backend/data
    ports:
      # افتراضياً localhost فقط؛ الكشف العام يجب أن يمرّ عبر reverse-proxy + TLS (R-LAW-06)
      - "${OPENWEBUI_BIND:-127.0.0.1}:${OPENWEBUI_PORT:-3000}:8080"
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health || exit 1"]   # صورة open-webui تحوي curl
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  postgres:                                  # حالة litellm (مفاتيح/كلفة) — يبقى بسجله الافتراضي (استثناء موثّق لـ R-ERR-14؛ ليس مسار طلبات)
    image: pgvector/pgvector@sha256:131dcf7ff6a900545df8e7e092c270aa8c6db2f2c818e408cb45ec21316b74e6   # pgvector/pgvector:pg16 (PG16 + pgvector) مُثبَّت بـ digest (2026-06-25، ADR-020؛ بدّل postgres:16-alpine)
    restart: unless-stopped
    environment:
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD مفقود}
      POSTGRES_DB: litellm
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm -d litellm"]
      interval: 10s
      timeout: 5s
      retries: 5

  memory:                                    # خدمة الذاكرة per-user (Context Engine L2) — ADR-019/023
    build: ../services/memory
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      # لا اعتماد على litellm (تجنّب دورة الاعتماد litellm↔memory)؛ التضمين عبر البوّابة fail-soft
      # عند الإقلاع حتى تجهز البوّابة، ثم يعمل طبيعياً على المسار الحارّ (ADR-023).
    environment:
      MEMORY_DATABASE_URL: postgresql://litellm:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD مفقود}@postgres:5432/litellm
      EMBEDDINGS_URL: http://litellm:4000/v1                                 # عبر البوّابة لا المحرّك (R-ARCH-10، ADR-023)
      EMBEDDINGS_API_KEY: ${MEMORY_LITELLM_KEY:?MEMORY_LITELLM_KEY مفقود}    # virtual key مخصّص لـ memory (لا master/مفتاح محرّك)
      EMBEDDINGS_MODEL: embed-default                                        # موديل التضمين في litellm-config
      EMBEDDING_MODEL_VERSION: qwen3-emb-0.6b-q8@1024                        # المتجه متطابق بايتياً عبر البوّابة → لا re-embedding
      CTX_QUERY_INSTRUCTION: "${CTX_QUERY_INSTRUCTION:-Given a user message, retrieve stored facts and past context about the user relevant to it.}"   # تعليمة استعلام Qwen3 (M2)
    networks: [internal]                      # داخلية فقط (غير مكشوفة)
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8088/health').status==200 else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

networks:
  internal:
    driver: bridge

volumes:
  openwebui-data:
  postgres-data:
