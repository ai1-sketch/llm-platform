# llm-platform — P-01 stack (ADR-005/010/011، ADR-025، ADR-028، ADR-030). 5 خدمات: open-webui → litellm → vllm (Qwen3 4B، GPU) + postgres-litellm + postgres-openwebui.
# الذاكرة/RAG عبر ميزات OWUI المدمجة (RAG + Personalization Memory، ADR-025). محرّك السياق المخصّص متقاعد إلى فرع future/context-engine.
# التشغيل (من جذر المستودع):
#   cp config/env/.env.example config/env/.env   # ثم املأ القيم
#   docker compose --env-file config/env/.env -f compose/docker-compose.yml up -d
# شرط مسبق: Docker Desktop (WSL2 backend) + تعريف NVIDIA لويندوز يدعم WSL2 GPU.
#   تحقّق أوّلاً (الصورة CUDA 13 كصورة vllm — يفحص كفاية التعريف R580+): docker run --rm --gpus all nvidia/cuda:13.0.2-base-ubuntu22.04 nvidia-smi
# قواعد: litellm/vllm غير مكشوفة (R-ARCH-24) · أسرار من env (R-ARCH-20) · أسماء صادقة الدور (R-ARCH-31).
# ✓ الصور مثبّتة بـ digest (إعادة الإنتاج). للترقية: حدّث الـ digest يدوياً بعد سحب الوسم + اختبار.
name: llm-platform

services:
  vllm:                                      # المحرّك (R-ARCH-31، ADR-028) — vLLM يخدم موديلاً واحداً مقيماً في الـ VRAM (يستبدل llama-swap/ADR-027)
    image: vllm/vllm-openai:v0.24.0@sha256:251eba5cc7c12fed0b75da22a9240e582b1c9e39f6fbc064f86781b963bd814f   # مُثبَّت بـ digest (2026-07-02، ADR-028). الصورة CUDA 13 → تعريف NVIDIA R580+ على المضيف
    restart: unless-stopped
    shm_size: "2gb"                          # PyTorch يحتاج /dev/shm أكبر؛ البديل الرسمي الأكثر عزلاً عن ipc:host (يكفي لـ GPU واحد بلا tensor-parallel)
    volumes:
      - hf-cache:/root/.cache/huggingface    # كاش أوزان HuggingFace — الموديل يُنزَّل تلقائياً أوّل تشغيل (لا خطوة يدوية، DoD §3)
      - vllm-cache:/root/.cache/vllm         # كاش torch.compile — يخفض الإقلاع الدافئ من دقائق إلى أقل من دقيقة
      - ../config/vllm/vllm-config.yaml:/app/config.yaml:ro   # الموديل + معاملات الذاكرة/السياق (config-driven، R-LAW-03)
    command: ["--config", "/app/config.yaml"]   # ENTRYPOINT للصورة = `vllm serve`
    environment:
      VLLM_API_KEY: ${VLLM_API_KEY:?VLLM_API_KEY مفقود}   # مصادقة /v1 داخلية؛ يطابق api_key في litellm-config (fail-fast — R-ERR-02)
      HF_TOKEN: ${HF_TOKEN:-}                              # فقط للموديلات المقفلة على HF (فارغ مقبول — Qwen3-4B-AWQ غير مقفل)
      VLLM_USE_V2_MODEL_RUNNER: ${VLLM_USE_V2_MODEL_RUNNER:-0}   # ‏0 على WSL2: ‏Model Runner V2 يتطلّب UVA غير المتاحة تحته (مُتحقَّق حيّاً — ADR-028)؛ على Linux أصلي/سحابة اضبط 1 في .env
      VLLM_LOGGING_LEVEL: ${VLLM_LOG_LEVEL:-INFO}                # مستوى السجل (R-ERR-17). سجلّ vllm نصّي افتراضي — استثناء موثّق لـ R-ERR-14 (الرصد الحرج request_id/كلفة عند البوّابة)
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks: [internal]
    healthcheck:
      # /health بلا مصادقة (سلوك vLLM الموثّق) وcurl موجود في الصورة. أوّل إقلاع بارد = تنزيل الموديل + torch.compile (دقائق) → start_period طويل
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 600s

  litellm:                                   # البوّابة (R-ARCH-31)
    image: ghcr.io/berriai/litellm@sha256:8f3517476b8293ccc1c3b0da7940d8dabbfe64b013454113f5a3cb68265c439b   # main-stable مُثبَّت بـ digest (2026-06-25)
    restart: unless-stopped
    depends_on:
      postgres-litellm:
        condition: service_healthy
      vllm:
        condition: service_started            # لا ننتظر جاهزية المحرّك (إقلاعه البارد دقائق)؛ طلبات ما قبل الجاهزية تفشل بوضوح حتى يصبح healthy
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?LITELLM_MASTER_KEY مفقود}   # fail-fast (R-ERR-02)
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY:?LITELLM_SALT_KEY مفقود}
      DATABASE_URL: postgresql://litellm:${LITELLM_DB_PASSWORD:?LITELLM_DB_PASSWORD مفقود}@postgres-litellm:5432/litellm   # نسخته المخصّصة (ADR-030)؛ دور عادي لا superuser (ADR-029)
      VLLM_API_KEY: ${VLLM_API_KEY:?VLLM_API_KEY مفقود}              # يطابق مفتاح المحرّك (ADR-028)
      LITELLM_LOG: ${LITELLM_LOG:-INFO}                              # مستوى السجل (R-ERR-17)
    volumes:
      - ../config/litellm/litellm-config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    networks: [internal]
    healthcheck:
      # صورة litellm (Chainguard) بلا curl/wget → python (المسار /health/liveliness مؤكَّد)
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:4000/health/liveliness').status==200 else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  open-webui:                                # الواجهة — نقطة الدخول الوحيدة المكشوفة؛ تملك RAG + Memory (ADR-025)
    image: ghcr.io/open-webui/open-webui@sha256:9fcea9c6e32ab60b0498f3986c6cdf651ddbe61db48d2213a3d28048ddd673d4   # v0.10.2 مُثبَّت بـ digest (2026-07-03؛ تنبيه أمني access-control + بحث هجين pgvector أصلي + Events)
    restart: unless-stopped
    depends_on:
      litellm:
        condition: service_healthy
      postgres-openwebui:
        condition: service_healthy            # OWUI يخزّن على نسخته المخصّصة (ADR-029/030)
    environment:
      OPENAI_API_BASE_URL: http://litellm:4000/v1            # تكلّم البوّابة فقط (R-ARCH-10)
      OPENAI_API_KEY: ${OPENWEBUI_LITELLM_KEY:?OPENWEBUI_LITELLM_KEY مفقود}   # virtual key من litellm
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY:?WEBUI_SECRET_KEY مفقود}
      # ── تخزين OWUI على PostgreSQL + pgvector (بدل SQLite + Chroma — ADR-029 قرار أساسي دائم؛ نسخة مخصّصة — ADR-030) ──
      # الرابط config-driven: محلي الآن؛ للانتقال لـ Postgres خارجي/مُدار (RDS/Azure/Cloud SQL، مع sslmode) غيّر المضيف فقط (ADR-029)
      DATABASE_URL: postgresql://openwebui:${OPENWEBUI_DB_PASSWORD:?OPENWEBUI_DB_PASSWORD مفقود}@postgres-openwebui:5432/openwebui   # ميتاداتا OWUI (مستخدمون/محادثات/معرفة/صلاحيات)
      VECTOR_DB: pgvector                                    # متجهات OWUI (RAG + ذاكرة) على pgvector بدل Chroma
      PGVECTOR_DB_URL: postgresql://openwebui:${OPENWEBUI_DB_PASSWORD:?OPENWEBUI_DB_PASSWORD مفقود}@postgres-openwebui:5432/openwebui   # قاعدة المتجهات (نفسها، صريح لتفادي أي fallback)
      GLOBAL_LOG_LEVEL: ${WEBUI_LOG_LEVEL:-INFO}              # مستوى السجل (R-ERR-17)
      WEBUI_NAME: ${WEBUI_NAME:-Sankari Chat}                 # اسم التطبيق/الواجهة المعروض (علامة، ليس اسم الموديل — ADR-017)
      ENABLE_EVALUATION_ARENA_MODELS: "false"                # نُطفئ موديل Arena الافتراضي (يظهر فقط ما تعرّفه البوّابة — حالياً Qwen3 4B)
      ENABLE_MEMORIES: "true"                                # ميزة الذاكرة per-user المدمجة (سطح الحقائق الفعّال — ADR-025)
      ENABLE_SIGNUP: "false"                                 # لا تسجيل ذاتي مفتوح (تقوية أمنية صريحة — SECURITY/ADR-026؛ لا نترك الافتراضي)
      ENABLE_OLLAMA_API: "false"                             # لا نستخدم Ollama (كل الموديلات عبر litellm)؛ يوقف فحص host.docker.internal:11434 المتكرّر ويقلّص السطح
    volumes:
      - openwebui-data:/app/backend/data
    ports:
      # افتراضياً localhost فقط؛ الكشف العام يجب أن يمرّ عبر reverse-proxy + TLS (R-LAW-06)
      - "${OPENWEBUI_BIND:-127.0.0.1}:${OPENWEBUI_PORT:-3000}:8080"
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health || exit 1"]   # صورة open-webui تحوي curl
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  # ── قاعدتا postgres مخصّصتان (ADR-030): نسخة لكل تطبيق — الشكل المحلي يطابق شكل الإنتاج (قاعدة البوّابة ≠ قاعدة بيانات الشركة).
  #    كلتاهما least-privilege (ADR-029): superuser `postgres` للإدارة فقط؛ التطبيق بدور عادي يملك قاعدته. سجلّهما افتراضي (استثناء موثّق R-ERR-14؛ ليستا مسار طلبات)
  postgres-litellm:                          # حالة البوّابة (مفاتيح/كلفة)
    image: pgvector/pgvector@sha256:131dcf7ff6a900545df8e7e092c270aa8c6db2f2c818e408cb45ec21316b74e6   # نفس الصورة المثبّتة للقاعدتين (صورة واحدة تُدار — ADR-020/030؛ الامتداد غير مفعّل هنا)
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${LITELLM_DB_ADMIN_PASSWORD:?LITELLM_DB_ADMIN_PASSWORD مفقود}    # سرّ إدارة هذه النسخة — لا يظهر في أي DATABASE_URL تطبيقي
      LITELLM_DB_PASSWORD: ${LITELLM_DB_PASSWORD:?LITELLM_DB_PASSWORD مفقود}              # يُستهلك في init لإنشاء دور litellm العادي
    volumes:
      - postgres-litellm-data:/var/lib/postgresql/data
      - ../config/postgres/litellm-init:/docker-entrypoint-initdb.d:ro   # دور/قاعدة litellm + عزل CONNECT — تلقائي على volume نظيف (على قائم: RUNBOOK)
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-openwebui:                        # بيانات OWUI (ميتاداتا + متجهات pgvector) — حيث ستعيش بيانات الشركة (اتجاه Data Asset)
    image: pgvector/pgvector@sha256:131dcf7ff6a900545df8e7e092c270aa8c6db2f2c818e408cb45ec21316b74e6   # pgvector/pgvector:pg16 مُثبَّت بـ digest (ADR-020/029)
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${OPENWEBUI_DB_ADMIN_PASSWORD:?OPENWEBUI_DB_ADMIN_PASSWORD مفقود}   # سرّ إدارة هذه النسخة — لا يظهر في أي DATABASE_URL تطبيقي
      OPENWEBUI_DB_PASSWORD: ${OPENWEBUI_DB_PASSWORD:?OPENWEBUI_DB_PASSWORD مفقود}           # يُستهلك في init لإنشاء دور openwebui العادي
    volumes:
      - postgres-openwebui-data:/var/lib/postgresql/data
      - ../config/postgres/openwebui-init:/docker-entrypoint-initdb.d:ro   # دور/قاعدة openwebui + عزل CONNECT + امتداد vector — تلقائي على volume نظيف (على قائم: RUNBOOK)
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  internal:
    driver: bridge

volumes:
  openwebui-data:            # ملفّات رفع OWUI (blobs) فقط — الميتاداتا/المتجهات في postgres-openwebui (ADR-029)
  postgres-litellm-data:
  postgres-openwebui-data:
  hf-cache:        # أوزان الموديلات من HuggingFace (قابل لإعادة الإنشاء — لا يحتاج نسخاً احتياطياً)
  vllm-cache:      # كاش torch.compile لـ vLLM (قابل لإعادة الإنشاء)
