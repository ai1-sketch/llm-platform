# llm-platform — إعداد LiteLLM = **نقطة التبديل الوحيدة** (R-ARCH-45).
# البدء بمحرّك محلي Gemma 4 (ADR-010/011). اسم الموديل = اسمه الفعلي "Gemma 4"؛ "Sankari Chat" علامة الواجهة في WEBUI_NAME لا اسم الموديل (ADR-017، يستبدل ADR-016).
# تبديل المحرّك/المزوّد لاحقاً = تعديل هذا الملف **فقط** (سطر واحد).
# ملاحظة (ADR-025): الذاكرة/RAG عبر ميزات OWUI المدمجة؛ لا hook ذاكرة ولا موديل embed-default هنا.

model_list:
  - model_name: Gemma 4                    # اسم الموديل الفعلي كما يراه المستخدم (ADR-017). "Sankari Chat" = علامة الواجهة في WEBUI_NAME لا اسم الموديل
    litellm_params:
      model: openai/gemma-4-e2b            # بادئة openai/ = عميل OpenAI-compatible
      api_base: http://llamacpp:8080/v1    # خدمة المحرّك على شبكة compose الداخلية
      api_key: os.environ/LLAMACPP_API_KEY # يطابق --api-key للمحرّك (داخلي)
      max_tokens: 2048                     # ميزانية افتراضية تكفي تفكير Gemma 4 + الجواب (تُطبَّق عند إغفال العميل)
    model_info:
      supports_vision: true                # يسمح بتمرير الصور (image_url/base64) عبر العقد إلى المحرّك (ADR-014)
  # Gemma 4 4B (E4B) عبر llama-swap — تجربة موديل محلّي أكبر (ADR-027). نفس نقطة المحرّك؛ llama-swap يبدّل بالاسم.
  - model_name: Gemma 4 4B
    litellm_params:
      model: openai/gemma-4-e4b            # يطابق مفتاح llama-swap `gemma-4-e4b` (ADR-027)
      api_base: http://llamacpp:8080/v1
      api_key: os.environ/LLAMACPP_API_KEY
      max_tokens: 2048
    model_info:
      supports_vision: false               # E4B نصّي حالياً (mmproj يُضاف لاحقاً بضبط ctx)
  # للتبديل لـ managed لاحقاً: علّق ما فوق وفعّل أحد البدائل (وحدّث model_name ليطابق الموديل الجديد — ADR-017):
  #   model: anthropic/<model>   api_key: os.environ/ANTHROPIC_API_KEY
  #   model: openai/<model>      api_key: os.environ/OPENAI_API_KEY

litellm_settings:
  drop_params: true
  json_logs: true        # تسجيل مهيكل JSON (R-ERR-14)

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
