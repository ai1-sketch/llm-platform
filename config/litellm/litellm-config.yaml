# llm-platform — إعداد LiteLLM = **نقطة التبديل الوحيدة** (R-ARCH-45).
# المحرّك المحلي = vLLM (ADR-028، يستبدل تجربة llama-swap/ADR-027). موديل الاختبار = Qwen3 4B (الموديل تفصيل قابل للتبديل — قرار المالك).
# تبديل المحرّك/المزوّد = تعديل هذا الملف **فقط** (سطر واحد). تبديل موديل vLLM نفسه = config/vllm/vllm-config.yaml.
# ملاحظة (ADR-028): لا max_tokens افتراضي — vLLM يرفض بـ 400 عند prompt+max_tokens > النافذة (لا يقصّ كما llama.cpp)؛ غيابه = ملء ما تبقّى من السياق.

model_list:
  - model_name: Qwen3 4B                   # الاسم الفعلي المعروض للمستخدم (ADR-017: تسمية صادقة؛ "Sankari Chat" = علامة الواجهة لا الموديل)
    litellm_params:
      model: hosted_vllm/qwen3-4b          # مزوّد vLLM المخصّص في LiteLLM (يمرّر reasoning/tools قياسياً)؛ يطابق served-model-name في vllm-config
      api_base: http://vllm:8000/v1        # خدمة المحرّك على شبكة compose الداخلية (منفذ vLLM الافتراضي)
      api_key: os.environ/VLLM_API_KEY     # يطابق VLLM_API_KEY للمحرّك (داخلي)
    # لا model_info/supports_vision: الرؤية معلّقة مؤقتاً — لا موديل multimodal يتّسع على 6GB تحت vLLM (ADR-028؛ تعود مع GPU أكبر بتبديل الموديل)
  # للتبديل لـ managed لاحقاً: علّق ما فوق وفعّل أحد البدائل (وحدّث model_name ليطابق الموديل الجديد — ADR-017):
  #   model: anthropic/<model>   api_key: os.environ/ANTHROPIC_API_KEY
  #   model: openai/<model>      api_key: os.environ/OPENAI_API_KEY

litellm_settings:
  drop_params: true
  json_logs: true        # تسجيل مهيكل JSON (R-ERR-14)

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
