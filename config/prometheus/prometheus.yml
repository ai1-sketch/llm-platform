# llm-platform — إعداد كشط المقاييس (النوع الثاني، ADR-031).
# يكشط vLLM + LiteLLM على شبكة compose الداخلية (لا كشف منافذ — R-ARCH-24).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # محرّك vLLM: /metrics (gpu_cache_usage، num_requests_running/waiting، TTFT، tokens/s، preemptions).
  # /metrics في vLLM بلا مصادقة (كـ /health) — لا يحتاج مفتاحاً.
  - job_name: vllm
    metrics_path: /metrics
    static_configs:
      - targets: ["vllm:8000"]

  # بوّابة LiteLLM: /metrics يعمل عبر callback "prometheus" (مُتحقَّق حيّاً: 200 + مقاييس litellm_*) بمصادقة Bearer.
  # المفتاح في ملف token (استبدل الـplaceholder بمفتاح litellm صالح — RUNBOOK)؛ حتى ذلك يظهر الهدف "down" (401، غير قاتل).
  # (الكلفة التفصيلية per-user تبقى أغنى في postgres-litellm/SpendLogs.)
  - job_name: litellm
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/litellm-metrics.token
    static_configs:
      - targets: ["litellm:4000"]

  # Prometheus يرصد نفسه (صحّة الكشط).
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
