# llama-swap — تبديل موديلات llama.cpp عند الطلب على GPU واحد (ADR-027).
# يُحمّل موديلاً واحداً فقط في الـ VRAM (6GB)؛ يختار بحقل `model` من الطلب OpenAI.
# مفاتيح الموديلات تطابق ما تُرسله البوّابة (litellm_params.model بلا بادئة openai/).
healthCheckTimeout: 300   # ثوانٍ انتظار جهوزية llama-server (تحميل GGUF ~4GB قد يأخذ وقتاً)

models:
  # Gemma 4 E2B (سريع، متعدّد الوسائط) — الافتراضي
  gemma-4-e2b:
    cmd: >
      llama-server --port ${PORT} --host 127.0.0.1
      --model /models/gemma-4-E2B-it-qat-UD-Q4_K_XL.gguf
      --mmproj /models/mmproj-F16.gguf --no-mmproj-offload --image-max-tokens 256
      --ctx-size 4096 --n-gpu-layers 999

  # Gemma 4 4B (E4B — أكبر/أجود، نصّي حالياً ليتّسع 6GB؛ الرؤية تُضاف بضبط ctx لاحقاً)
  gemma-4-e4b:
    cmd: >
      llama-server --port ${PORT} --host 127.0.0.1
      --model /models/gemma-4-E4B-it-qat-UD-Q4_K_XL.gguf
      --ctx-size 4096 --n-gpu-layers 999
